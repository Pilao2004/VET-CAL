# Publica o app no Firebase Hosting (projeto vet-calc-pro) a cada envio para a branch main.
# Requer o segredo FIREBASE_SERVICE_ACCOUNT_VET_CALC_PRO no GitHub (Settings > Secrets and variables > Actions).
name: Deploy no Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0.9.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VET_CALC_PRO }}
          projectId: vet-calc-pro
          channelId: live
