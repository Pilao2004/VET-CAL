<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Licenças VET CALC PRO</title>
<style>
  :root { --bg: #060D1C; --surface: #10213B; --line: #243D58; --fg: #F4F7FB; --muted: #9AADC6; --accent: #00D6A0; --warn: #FBBF24; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 32px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 20px; }
  h1 { margin: 0; font-size: 1.5rem; }
  p { margin: 0; color: var(--muted); }
  form, .result { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: grid; gap: 14px; }
  label { display: grid; gap: 6px; font-size: .85rem; color: var(--muted); }
  input, select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font-size: 1rem; }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { padding: 13px; border: 0; border-radius: 10px; background: var(--accent); color: #062C23; font-weight: 800; font-size: 1rem; cursor: pointer; }
  button.secondary { background: transparent; color: var(--fg); border: 1px solid var(--line); font-weight: 600; }
  code { display: block; font: 700 1.15rem/1.4 ui-monospace, Menlo, monospace; color: var(--accent); word-break: break-all; }
  .error { color: #FCA5A5; }
  .hint { font-size: .8rem; }
</style>
</head>
<body>
<main>
  <div>
    <h1>Gerar código de acesso Premium</h1>
    <p>Use após cada venda. O comprador ativa no app com o e-mail da compra e este código.</p>
  </div>
  <form id="form">
    <label>Senha de administrador
      <input id="password" type="password" required autocomplete="current-password">
    </label>
    <label>E-mail do comprador
      <input id="email" type="email" required autocomplete="off">
    </label>
    <label>Validade
      <select id="days">
        <option value="31">1 mês</option>
        <option value="93">3 meses</option>
        <option value="186">6 meses</option>
        <option value="366" selected>1 ano</option>
        <option value="3650">Vitalício (10 anos)</option>
      </select>
    </label>
    <button type="submit" id="submit">Gerar código</button>
    <p id="error" class="error" hidden></p>
  </form>
  <section id="result" class="result" hidden>
    <p>Código para <strong id="r-email"></strong>, válido até <strong id="r-exp"></strong>:</p>
    <code id="r-key"></code>
    <button type="button" class="secondary" id="copy">Copiar mensagem para o comprador</button>
    <p class="hint" id="copied" hidden>Mensagem copiada.</p>
  </section>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  let message = '';
  $('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('error').hidden = true;
    $('submit').disabled = true;
    try {
      const res = await fetch('./api/admin/license', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: $('password').value, email: $('email').value, days: Number($('days').value) }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Não foi possível gerar o código.');
      const exp = data.expiresAt.split('-').reverse().join('/');
      $('r-email').textContent = data.email;
      $('r-exp').textContent = exp;
      $('r-key').textContent = data.key;
      message = `Olá! Seu acesso ao VET CALC PRO Premium está liberado.\n\n1. Abra ${location.origin}\n2. Menu (três pontinhos) > Seja Premium > Já comprei\n3. E-mail: ${data.email}\n4. Código: ${data.key}\n\nVálido até ${exp}. Bons estudos e bons plantões!`;
      $('result').hidden = false;
      $('copied').hidden = true;
    } catch (err) {
      $('error').textContent = err.message;
      $('error').hidden = false;
    } finally {
      $('submit').disabled = false;
    }
  });
  $('copy').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(message); $('copied').hidden = false; }
    catch { $('copied').textContent = message; $('copied').hidden = false; }
  });
</script>
</body>
</html>
